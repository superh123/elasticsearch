name: multiterms-unmapped-test

on:
  push:
    branches: [test/multiterms-unmapped-field]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Spotless check
        run: ./gradlew :x-pack:plugin:analytics:spotlessCheck --console=plain
      - name: Run analytics unit tests
        run: ./gradlew :x-pack:plugin:analytics:test --console=plain
      - name: Run multiterms integration tests
        run: ./gradlew :x-pack:plugin:analytics:internalClusterTest --tests "org.elasticsearch.xpack.analytics.multiterms.*" --console=plain
